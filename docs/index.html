<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pyroguard AI - Dashboard</title>
    <!-- استدعاء مكتبات الخرائط والتنسيقات -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        /* تنسيقات شاشة الترحيب Splash Screen */
        #splash {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #1e1e2f, #0f0f1a);
            color: white;
            display: flex;
            flex-direction: column;
            align-content: center;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease-in-out;
        }
        .sp-title { font-size: 2.5rem; font-weight: bold; margin-bottom: 20px; letter-spacing: 2px; }
        .sp-enter {
            padding: 12px 30px;
            font-size: 1.1rem;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }
        .sp-enter:hover { background-color: #c0392b; }
        
        /* إخفاء محتوى لوحة التحكم الأساسية أثناء شاشة العرض */
        #main-app { display: block; padding: 20px; color: #333; }
        .logo-container img { max-width: 150px; height: auto; }
    </style>
</head>
<body>

    <!-- 1. شاشة الترحيب (Splash Screen) -->
    <div id="splash">
        <div class="logo-container">
            <!-- سيتم استبدال وسم الشعار هنا تلقائياً -->
            <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🔥</text></svg>" alt="Logo">
        </div>
        <div class="sp-title">Pyroguard AI</div>
        <!-- المعرّف هنا يجب أن يكون enter-btn حصراً وبشكل مطابق للجافا سكريبت -->
        <button class="sp-enter" id="enter-btn">ACCÉDER AU TABLEAU DE BORD</button>
    </div>

    <!-- 2. واجهة تطبيق لوحة التحكم الرئيسية -->
    <div id="main-app">
        <h2>Tableau de Bord Synoptique - WRF-ARW</h2>
        <p>Date du Run: <span id="run-date">20260526</span> (Cycle: <span id="run-cycle">00</span>Z)</p>
        <div id="map" style="width: 100%; height: 600px; background: #eee; border-radius: 8px;"></div>
    </div>

    <!-- استدعاء سكربت الخرائط -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // إدخال المتغيرات القادمة من الباش كود مباشرة بدون علامات اقتباس للمصفوفة[cite: 1]
        const RUN_DATE = "20260526";
        const RUN_CYCLE = "00";
        const AVAILABLE_RUNS = [ "20260526_00Z","20260522_00Z" ]; // سيتم استبدالها بـ [ "20260526_00Z" ] مثلًا[cite: 1]

        // كود التحكم عند اكتمال واجهة المستخدم واستهداف زر الدخول
        document.addEventListener("DOMContentLoaded", function() {
            console.log("[Pyroguard] DOM chargé. Configuration du bouton...");

            const enterBtn = document.getElementById("enter-btn");
            const splash = document.getElementById("splash");

            if (enterBtn && splash) {
                enterBtn.addEventListener("click", function() {
                    console.log("[Pyroguard] Clic détecté sur le bouton d'accession.");
                    
                    // تلاشي تدريجي لشاشة الترحيب
                    splash.style.opacity = "0";
                    
                    setTimeout(function() {
                        splash.style.display = "none";
                        
                        // تشغيل لوحة التحكم والخرائط بأمان دون التأثير على عمل الزر
                        try {
                            if (typeof initApp === "function") {
                                initApp();[cite: 1]
                            } else {
                                // تشغيل الدوال الفردية الافتراضية للخرائط إذا لم تكن مجمعة في initApp
                                initMap();
                            }
                        } catch (error) {
                            console.error("[Pyroguard] Erreur d'initialisation des cartes:", error);
                        }
                    }, 500); 
                });
            } else {
                console.error("[Pyroguard Error] Éléments HTML introuvables (#enter-btn ou #splash).");
            }
        });

        // دالة افتراضية لبناء الخريطة بعد تخطي شاشة الدخول
        function initMap() {
            console.log("[Pyroguard] Initialisation de la carte Leaflet...");
            // مثال لإعداد الخريطة على إحداثيات قسنطينة/الجزائر كمثال افتراضي للتحقق
            const map = L.map('map').setView([36.365, 6.614], 8);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '© OpenStreetMap'
            }).addTo(map);
            console.log("[Pyroguard] Carte Leaflet chargée avec succès. Simulations disponibles:", AVAILABLE_RUNS);
        }
    </script>
</body>
</html>
